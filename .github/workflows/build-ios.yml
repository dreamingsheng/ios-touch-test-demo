name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Xcode project layout
        run: |
          mkdir -p TouchTestApp
          mkdir -p TouchTestApp.xcodeproj/xcshareddata/xcschemes
          mv TouchTestApp.swift TouchTestApp/
          mv TouchTestView.swift TouchTestApp/
          mv project.pbxproj TouchTestApp.xcodeproj/
          mv TouchTestApp.xcscheme TouchTestApp.xcodeproj/xcshareddata/xcschemes/

      - name: Build without code signing
        run: |
          xcodebuild \
            -project TouchTestApp.xcodeproj \
            -scheme TouchTestApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TouchTestApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload TouchTestApp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchTestApp-unsigned
          path: TouchTestApp-unsigned.ipa
          if-no-files-found: error

      - name: Publish latest test IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-latest >/dev/null 2>&1 || \
            gh release create test-latest --title "Latest test build" --notes "Unsigned IPA for SideStore or AltStore testing."
          gh release upload test-latest TouchTestApp-unsigned.ipa --clobber
