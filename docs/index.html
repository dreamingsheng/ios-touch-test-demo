<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Touch Test">
  <title>Touch Test</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css?v=13">
</head>
<body>
<div id="app">
  <header>
    <div class="title"><h1>Touch Test <small>v13</small></h1><small id="modeName">多点轨迹</small><button id="safeBtn">边距</button><button id="reportBtn">报告</button></div>
    <div id="stats">
      <div class="stat"><b id="v0">0</b><span id="l0">当前触点</span></div>
      <div class="stat"><b id="v1">0</b><span id="l1">最大触点</span></div>
      <div class="stat"><b id="v2">0</b><span id="l2">事件/秒</span></div>
      <div class="stat"><b id="v3">—</b><span id="l3">测试数据</span></div>
    </div>
  </header>
  <main id="stage">
    <canvas id="surface"></canvas><canvas id="overlay"></canvas>
    <div id="modePanel"></div><div id="target"></div><div id="holdMark"></div>
    <div id="message">多根手指同时滑动，检查断线、跳点和最大触点数</div>
    <div class="actions"><button id="menuBtn">项目</button><button id="clearBtn">重置</button><button id="fullBtn">全屏</button></div>
  </main>
  <nav id="nav" aria-label="测试项目">
    <button data-mode="multi" class="active">多点</button><button data-mode="draw">画画</button><button data-mode="line">划线</button><button data-mode="ghost">鬼点</button><button data-mode="auto">自动跟随</button><button data-mode="grid">坏点网格</button><button data-mode="edge">边缘</button><button data-mode="pinch">图片缩放</button><button data-mode="map">地图手势</button><button data-mode="read">阅读翻页</button><button data-mode="video">短视频</button><button data-mode="moba">MOBA轮盘</button><button data-mode="aim">射击瞄准</button><button data-mode="ui">控件设置</button><button data-mode="menu">多级菜单</button><button data-mode="type">打字</button><button data-mode="cross">十字轴光标</button><button data-mode="tap">点击精度</button><button data-mode="hold">长按漂移</button><button data-mode="colors">纯色切换</button><button data-mode="bars">标准色条</button>
  </nav>
</div>
<dialog id="reportDialog" aria-labelledby="reportTitle"><div class="report-heading"><h2 id="reportTitle">本次测试报告</h2><button id="closeReport">关闭</button></div><p>采样与报告只留在本页内存中，不自动上传。导出后可复查轨迹；页面重开会清空。报告不自动判定硬件合格。</p><label>设备型号 / 测试条件<input id="reportDevice" maxlength="160" placeholder="例如：iPhone 型号、iOS 版本、充电/未充电"></label><p id="reportStatus" role="status"></p><textarea id="reportPreview" readonly aria-label="报告预览"></textarea><div class="report-actions"><button id="exportJson">导出完整 JSON</button><button id="exportCsv">导出轨迹 CSV</button></div></dialog>
<dialog id="safeDialog" aria-label="安全边距"><div class="report-heading"><b>透明全屏 · 安全边距</b><button id="closeSafe">完成</button></div><p>背景始终铺满屏幕。若系统工具栏仍遮挡内容，可在系统安全区之外增加边距，拖动后立即生效。</p><label>顶部额外边距 <b id="topInsetValue">0</b> px<input id="topInset" type="range" min="0" max="100" value="0"></label><label>底部额外边距 <b id="bottomInsetValue">0</b> px<input id="bottomInset" type="range" min="0" max="100" value="0"></label><button id="resetSafe">恢复自动</button><p id="safeMetrics"></p></dialog>
<dialog id="modeDialog" aria-labelledby="modeDialogTitle"><div class="report-heading"><h2 id="modeDialogTitle">测试项目</h2><button id="closeModes">继续测试</button></div><div id="modeChoices"></div><div class="mode-tools"><button id="menuReset">重置本项</button><button id="menuReport">测试报告</button><button id="menuChrome">显示工具栏</button><button id="editGameLayout">移动游戏控件</button><button id="resetGameLayout">恢复游戏布局</button></div><p id="layoutHelp">测试画面铺满窗口，悬浮按钮避让系统区域。</p></dialog>
<script src="./app.js?v=13"></script>
</body>
</html>
